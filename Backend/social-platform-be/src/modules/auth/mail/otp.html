<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Reset Password</title>
</head>

<body style="margin:0; padding:0; background-color:#f4f6f8; font-family:Arial, sans-serif;">

    <table width="100%" cellpadding="0" cellspacing="0" style="padding: 20px 0;">
        <tr>
            <td align="center">

                <!-- Card -->
                <table width="400" cellpadding="0" cellspacing="0"
                    style="background:#ffffff; border-radius:10px; padding:30px; box-shadow:0 4px 10px rgba(0,0,0,0.1);">

                    <!-- Title -->
                    <tr>
                        <td align="center">
                            <h2 style="margin:0; color:#333;">Reset Your Password</h2>
                        </td>
                    </tr>

                    <!-- Space -->
                    <tr>
                        <td height="20"></td>
                    </tr>

                    <!-- Content -->
                    <tr>
                        <td style="color:#555; font-size:14px; text-align:center;">
                            We received a request to reset your password.<br>
                            Use the OTP below to continue:
                        </td>
                    </tr>

                    <!-- Space -->
                    <tr>
                        <td height="25"></td>
                    </tr>

                    <!-- OTP BOX -->
                    <tr>
                        <td align="center">
                            <div style="
                display:inline-block;
                padding:15px 25px;
                font-size:28px;
                font-weight:bold;
                letter-spacing:5px;
                background:#f1f5ff;
                color:#3b82f6;
                border-radius:8px;
              ">
                                {{otp}}
                            </div>
                        </td>
                    </tr>

                    <!-- Space -->
                    <tr>
                        <td height="25"></td>
                    </tr>

                    <!-- Expire -->
                    <tr>
                        <td style="text-align:center; color:#888; font-size:13px;">
                            This OTP will expire in <b>5 minutes</b>
                        </td>
                    </tr>

                    <!-- Space -->
                    <tr>
                        <td height="20"></td>
                    </tr>

                    <!-- Warning -->
                    <tr>
                        <td style="text-align:center; color:#999; font-size:12px;">
                            If you didn’t request this, you can safely ignore this email.
                        </td>
                    </tr>

                </table>

                <!-- Footer -->
                <table width="400" cellpadding="0" cellspacing="0" style="margin-top:15px;">
                    <tr>
                        <td style="text-align:center; font-size:12px; color:#aaa;">
                            © 2026 Your App. All rights reserved.
                        </td>
                    </tr>
                </table>

            </td>
        </tr>
    </table>

</body>

</html>
